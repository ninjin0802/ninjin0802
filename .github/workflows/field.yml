# README の「この1年の はたけ」の絵を毎日描き直す。
# 絵は field ブランチに 1 コミットだけ置き、毎回上書きする（main の履歴を汚さない）。
name: field

on:
  schedule:
    - cron: "17 20 * * *" # 毎日 05:17（日本時間）
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/field.mjs", ".github/workflows/field.yml"]

permissions:
  contents: write

concurrency:
  group: field
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/field.mjs dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish to the field branch
        run: |
          cd dist
          git init -q -b field
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Draw the field"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" field
